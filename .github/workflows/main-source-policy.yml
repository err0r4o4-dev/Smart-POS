name: Main source policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review, closed]

permissions:
  pull-requests: read

concurrency:
  group: main-source-policy-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  main-source-policy:
    name: Main source policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every open PR sharing this commit to use develop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          try {
            const { GH_TOKEN: token, REPOSITORY: repository, REPOSITORY_ID: repositoryId, HEAD_SHA: headSha } = process.env;
            if (!token || !repository || !repositoryId || !/^[a-f0-9]{40}$/i.test(headSha ?? '')) {
              throw new Error('Source policy configuration is missing or invalid.');
            }

            const matchingPullRequests = [];
            for (let page = 1; ; page += 1) {
              const response = await fetch(`https://api.github.com/repos/${repository}/pulls?state=open&base=main&per_page=100&page=${page}`, {
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${token}`,
                  'User-Agent': 'smartpos-main-source-policy',
                  'X-GitHub-Api-Version': '2026-03-10',
                },
                signal: AbortSignal.timeout(15000),
              });
              if (!response.ok) {
                throw new Error(`Cannot verify open pull requests: GitHub returned HTTP ${response.status}.`);
              }
              const pullRequests = await response.json();
              if (!Array.isArray(pullRequests)) {
                throw new Error('GitHub returned an invalid pull request list.');
              }
              matchingPullRequests.push(...pullRequests.filter(pullRequest => pullRequest.head?.sha === headSha));
              if (pullRequests.length < 100) {
                break;
              }
            }

            if (matchingPullRequests.length === 0) {
              throw new Error('No open main pull request matches this commit.');
            }
            const disallowedPullRequests = matchingPullRequests.filter(pullRequest =>
              pullRequest.state !== 'open' ||
              pullRequest.base?.ref !== 'main' ||
              String(pullRequest.base?.repo?.id ?? '') !== repositoryId ||
              pullRequest.head?.ref !== 'develop' ||
              String(pullRequest.head?.repo?.id ?? '') !== repositoryId
            );
            if (disallowedPullRequests.length > 0) {
              const numbers = disallowedPullRequests.map(pullRequest => Number.isInteger(pullRequest.number) ? `#${pullRequest.number}` : 'unknown');
              throw new Error(`Only develop from this repository may target main. Disallowed PRs sharing this commit: ${numbers.join(', ')}.`);
            }
            console.log('Source policy passed: every open main PR sharing this commit uses develop from this repository.');
          } catch (error) {
            console.error(`::error::${error.message}`);
            process.exitCode = 1;
          }
          NODE
