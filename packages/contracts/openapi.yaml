  parameters:
    OrganizationID:
      {
        in: path,
        name: id,
        required: true,
        schema: { type: string, format: uuid },
      }
    CSRF:
      {
        in: header,
        name: X-CSRF-Token,
        required: true,
        schema: { type: string },
      }
