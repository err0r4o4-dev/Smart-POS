openapi: 3.1.0
info:
  title: SmartPOS Foundation through Business Operations API
  version: 1.0.0
  description: Phase 0-4 local implementation and Phase 5.1 customer returns/refunds. Inventory, purchasing, shelves and POS use exact decimal strings, immutable ledger and atomic balances with tenant/branch authorization. Returns preserve original sales and allocate historical paid amounts; physical return posting creates pending refunds, not evidence of payment. Manual refund reporting and confirmation preserve reconciliation evidence; cash disbursements update only an authorized open shift. Tenant writes require allowed Origin and X-CSRF-Token. Idempotency-Key is required for transactional commands. Later Phase 5 capabilities, valuation, reservations, gateway payments and AI remain deferred.
servers:
  - url: /
