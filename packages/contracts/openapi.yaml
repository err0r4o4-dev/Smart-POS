openapi: 3.1.0
info:
  title: SmartPOS Foundation, Identity, Organization and Catalog API
  version: 1.0.0
  description: Phase 0 foundation, Phase 1A sessions and Phase 1B organization/branch/membership authorization. POS and inventory remain unavailable. All tenant writes require allowed Origin and X-CSRF-Token. UUID path IDs are untrusted; inactive/nonmember tenants return 404, insufficient permissions 403, ownership/uniqueness conflicts 409. PATCH accepts complete editable fields rather than a sparse patch.
servers:
  - url: /
paths:
  /api/v1/organizations/{id}/categories:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listCatalogcategories
      security:
        - sessionCookie: []
      description: Requires catalog.read. Exclude ARCHIVED by default; bounded pagination.
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
              - ARCHIVED
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - name
              - -name
              - updated
              - -updated
            default: name
      responses:
        '200':
          description: Catalog result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CatalogCategoryPage'
        '400':
          description: Invalid input or upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission, Origin or CSRF denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Scoped resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate, reference, stale revision or preview conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createCatalogCategory
      security:
        - sessionCookie: []
      description: 'Requires catalog.category.manage. '
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogCategoryInput'
      responses:
        '201':
          description: Catalog result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CatalogCategory'
        '400':
          description: Invalid input or upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission, Origin or CSRF denied
          content:
