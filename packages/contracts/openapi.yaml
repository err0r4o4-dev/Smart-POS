          }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }
        '503': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/invitations/{invitationId}:
    parameters:
      [
        { $ref: '#/components/parameters/OrganizationID' },
        {
          in: path,
          name: invitationId,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    delete:
      operationId: revokeInvitation
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '200':
          {
            description: Revoked,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: object,
                                properties: { revoked: { type: boolean } },
                              },
                          },
                      },
                  },
              },
          }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      security: [{ sessionCookie: [] }]
      description: Authenticated intended recipient only. Rechecks inviter authority and active branch assignments. Atomically consumes invitation and creates/reactivates one membership. Expired/revoked/replayed/wrong-email tokens return 404; existing active/suspended memberships return 409.
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                additionalProperties: false,
                required: [token],
                properties: { token: { type: string, writeOnly: true } },
              }
      responses:
        '200': { $ref: '#/components/responses/OrganizationContext' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/audit:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      operationId: organizationAudit
      security: [{ sessionCookie: [] }]
      description: Newest 100 records. Owner all; Manager requires all event branches within their assignments and visible target membership. No secrets or raw tokens.
      parameters:
        [{ in: query, name: member_id, schema: { type: string, format: uuid } }]
      responses:
        '200':
          {
            description: Scoped audit events,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: array,
                                items:
                                  { $ref: '#/components/schemas/AuditEvent' },
                              },
                          },
                      },
                  },
              },
          }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations:
    get:
      operationId: listOrganizations
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Active memberships only; subordinate roles receive redacted contact fields.
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      data:
                        {
                          type: array,
                          items: { $ref: '#/components/schemas/Organization' },
                        },
                    },
                }
        '401': { $ref: '#/components/responses/AuthError' }
        '503': { $ref: '#/components/responses/AuthError' }
    post:
      operationId: createOrganization
      security: [{ sessionCookie: [] }]
      description: Atomically creates organization, OWNER membership, active main branch, default THB/Asia-Bangkok configuration and audit. Replaying the same per-user key/payload returns the same context; different payload returns 409.
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - {
            in: header,
            name: Idempotency-Key,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/OrganizationInput' }
                - {
                    type: object,
                    required: [branch],
                    properties:
                      { branch: { $ref: '#/components/schemas/BranchInput' } },
                  }
      responses:
        '201': { $ref: '#/components/responses/OrganizationContext' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }
        '503': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      operationId: getOrganization
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OrganizationContext' }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
    patch:
      operationId: updateOrganization
      security: [{ sessionCookie: [] }]
      description: OWNER only. Full editable fields; no ownership change or tenant deactivation.
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/OrganizationInput' } },
            },
        }
      responses:
        '200':
          {
            description: Updated organization,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data: { $ref: '#/components/schemas/Organization' },
                          },
                      },
                  },
              },
          }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/context:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      operationId: organizationContext
      security: [{ sessionCookie: [] }]
      description: Membership revalidated on every call. Only ACTIVE authorized branches. Owner receives all; operational roles receive organization identity with redacted contact data.
      responses:
        '200': { $ref: '#/components/responses/OrganizationContext' }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/permissions:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      operationId: effectivePermissions
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          {
            description: Stable permission identifiers,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          { data: { type: array, items: { type: string } } },
                      },
                  },
              },
          }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/roles:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      operationId: roleMatrix
      security: [{ sessionCookie: [] }]
      description: Fixed role permission map. Owner/Manager only. Manager permissions additionally require assigned branch scope and cannot modify Owner, Manager or themselves.
      responses:
        '200':
          {
            description: Fixed role map,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: object,
                                additionalProperties:
                                  { type: array, items: { type: string } },
                              },
                          },
                      },
                  },
              },
          }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/branches:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      operationId: listBranches
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          {
            description: Authorized branches; Owner also sees inactive branches,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: array,
                                items: { $ref: '#/components/schemas/Branch' },
                              },
                          },
                      },
                  },
              },
          }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
    post:
      operationId: createBranch
      security: [{ sessionCookie: [] }]
      description: OWNER only, unique code within organization.
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/BranchInput' } },
            },
        }
      responses:
        '201': { $ref: '#/components/responses/Branch' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/branches/{branchId}:
    parameters:
      [
        { $ref: '#/components/parameters/OrganizationID' },
        {
          in: path,
          name: branchId,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    get:
      operationId: getBranch
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Branch' }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
    patch:
      operationId: updateBranch
      security: [{ sessionCookie: [] }]
      description: OWNER may activate/deactivate except final ACTIVE branch. Manager updates only their ACTIVE assigned branches, without status changes. No hard-delete operation.
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/BranchInput' } },
            },
        }
      responses:
        '200': { $ref: '#/components/responses/Branch' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }
  /api/v1/auth/register:
    post:
      operationId: register
      security: []
      description: Registers an active user with pending organization onboarding; does not establish a session. Requires allowed Origin and JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password:
                  {
                    type: string,
                    minLength: 12,
                    maxLength: 128,
                    writeOnly: true,
                  }
                display_name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Registered without a session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '409': { $ref: '#/components/responses/AuthError' }
        '429': { $ref: '#/components/responses/AuthError' }
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      description: Creates a server-side session; Set-Cookie is HttpOnly, SameSite=Lax, Secure in production. Requires allowed Origin and JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, writeOnly: true }
      responses:
        '200':
          description: Session established.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '429': { $ref: '#/components/responses/AuthError' }
  /api/v1/auth/me:
    get:
      operationId: currentUser
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Active session, safe profile and CSRF token for state-changing authenticated requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ sessionCookie: [] }]
      description: Requires allowed Origin and X-CSRF-Token matching the active session.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Server session revoked and cookie cleared.
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      security: []
      description: Generic response; sends a one-time link via configured SMTP for eligible accounts. Requires allowed Origin and JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Generic reset request accepted. }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '429': { $ref: '#/components/responses/AuthError' }
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      security: []
      description: Atomically consumes a 15-minute token, changes password and revokes all sessions. Requires allowed Origin and JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, writeOnly: true }
                password:
                  {
                    type: string,
                    minLength: 12,
                    maxLength: 128,
                    writeOnly: true,
                  }
      responses:
        '200': { description: Password reset complete. }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '429': { $ref: '#/components/responses/AuthError' }
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is alive; independent of database and AI.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: PostgreSQL reachable and migration version 1 clean.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Required database or schema unavailable; no internal details disclosed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/system:
    get:
      operationId: getSystemFoundation
      security: []
      responses:
        '200':
          description: Public foundation information, not tenant/user data.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [name, phase, authentication]
                    additionalProperties: false
                    properties:
                      name: { type: string, const: SmartPOS }
                      phase: { type: integer, const: 0 }
                      authentication: { type: string, const: server_sessions }
components:
  parameters:
    OrganizationID:
      {
        in: path,
        name: id,
        required: true,
        schema: { type: string, format: uuid },
      }
    CSRF:
      {
        in: header,
        name: X-CSRF-Token,
        required: true,
        schema: { type: string },
      }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: smartpos_session
      description: Development cookie name; production uses __Host-smartpos_session.
  responses:
    OrganizationContext:
      description: Authorized organization context.
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  properties:
                    {
                      data:
                        { $ref: '#/components/schemas/OrganizationContext' },
                    },
                },
            },
        }
    Branch:
      description: Authorized branch.
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  properties: { data: { $ref: '#/components/schemas/Branch' } },
                },
            },
        }
    Member:
      description: Authorized membership.
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  properties: { data: { $ref: '#/components/schemas/Member' } },
                },
            },
        }
    InvalidInput:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthError:
      description: Authentication or rate-limit error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    CatalogProductInput:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - category_id
        - brand_id
        - status
        - revision
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
        description:
          type: string
          maxLength: 2000
        category_id:
          type:
            - string
            - 'null'
          format: uuid
        brand_id:
          type:
            - string
            - 'null'
          format: uuid
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - ARCHIVED
        revision:
          type: integer
          minimum: 0
    CatalogProductCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - category_id
        - brand_id
        - status
        - revision
        - variants
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
        description:
          type: string
          maxLength: 2000
        category_id:
          type:
            - string
            - 'null'
          format: uuid
        brand_id:
          type:
            - string
            - 'null'
          format: uuid
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - ARCHIVED
        revision:
          type: integer
          minimum: 0
        variants:
          type: array
          items:
            $ref: '#/components/schemas/CatalogVariantInput'
          minItems: 1
          maxItems: 100
    CatalogVariantInput:
      type: object
      additionalProperties: false
      required:
        - sku
        - name
        - attributes
        - unit_id
        - cost_price
        - selling_price
        - status
        - revision
      properties:
        sku:
          type: string
          maxLength: 80
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$
        name:
          type: string
          maxLength: 200
          minLength: 1
        attributes:
          type: object
          maxProperties: 12
          propertyNames:
            type: string
            minLength: 1
            maxLength: 40
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 200
        unit_id:
          type: string
          format: uuid
        cost_price:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$
          description: Exact decimal string; cost >= 0, selling > 0.
        selling_price:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$
          description: Exact decimal string; cost >= 0, selling > 0.
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - ARCHIVED
        revision:
          type: integer
          minimum: 0
    CatalogCategoryInput:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - status
        - revision
        - parent_id
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - ARCHIVED
        revision:
          type: integer
          minimum: 0
        parent_id:
          type:
            - string
            - 'null'
          format: uuid
    CatalogBrandInput:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - status
        - revision
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - ARCHIVED
        revision:
          type: integer
          minimum: 0
    CatalogUnitInput:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - status
        - revision
        - code
        - unit_type
        - base_unit_id
        - conversion_factor
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - ARCHIVED
        revision:
          type: integer
          minimum: 0
        code:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,49}$
        unit_type:
          type: string
          enum:
            - COUNT
            - WEIGHT
            - VOLUME
            - PACKAGING
        base_unit_id:
          type:
            - string
            - 'null'
          format: uuid
        conversion_factor:
          type: string
          pattern: ^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$
    CatalogBarcodeInput:
      type: object
      additionalProperties: false
      required:
        - code
        - symbology
        - source
        - is_primary
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
        symbology:
          type: string
          enum:
            - EAN13
            - EAN8
            - UPCA
            - CODE128
        source:
          type: string
          enum:
            - MANUFACTURER
            - ALIAS
        is_primary:
          type: boolean
    CatalogBarcode:
      type: object
      additionalProperties: false
      required:
        - id
        - variant_id
        - code
        - symbology
        - source
        - is_primary
      properties:
        id:
          type: string
          format: uuid
        variant_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 80
        symbology:
          type: string
          enum:
            - EAN13
            - EAN8
            - UPCA
            - CODE128
        source:
          type: string
          enum:
            - MANUFACTURER
            - INTERNAL
            - ALIAS
        is_primary:
          type: boolean
    CatalogVariant:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - product_id
        - sku
        - name
        - attributes
        - unit_id
        - cost_price
        - selling_price
        - status
        - revision
        - currency
        - barcodes
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
          maxLength: 80
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$
        name:
          type: string
          maxLength: 200
          minLength: 1
        attributes:
          type: object
          maxProperties: 12
          propertyNames:
            type: string
            minLength: 1
            maxLength: 40
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 200
        unit_id:
          type: string
          format: uuid
        cost_price:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$
          description: Exact decimal string; cost >= 0, selling > 0.
        selling_price:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$
          description: Exact decimal string; cost >= 0, selling > 0.
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - ARCHIVED
        revision:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        barcodes:
          type: array
          items:
            $ref: '#/components/schemas/CatalogBarcode'
    CatalogProduct:
