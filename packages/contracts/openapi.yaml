openapi: 3.1.0
info:
  title: SmartPOS Foundation, Identity and Organization API
  version: 1.0.0
  description: Phase 0 foundation, Phase 1A sessions and Phase 1B organization/branch/membership authorization. POS and inventory remain unavailable. All tenant writes require allowed Origin and X-CSRF-Token. UUID path IDs are untrusted; inactive/nonmember tenants return 404, insufficient permissions 403, ownership/uniqueness conflicts 409. PATCH accepts complete editable fields rather than a sparse patch.
servers:
  - url: /
paths:
  /api/v1/organizations/{id}/members:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      operationId: listMembers
      security: [{ sessionCookie: [] }]
      description: Owner sees all historical memberships; Manager sees themselves and subordinate members whose entire assignment is within their branch scope.
      responses:
        '200':
          {
            description: Scoped members,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: array,
                                items: { $ref: '#/components/schemas/Member' },
                              },
                          },
                      },
                  },
              },
          }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/members/{memberId}:
    parameters:
      [
        { $ref: '#/components/parameters/OrganizationID' },
        {
          in: path,
          name: memberId,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    get:
      operationId: getMember
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Member' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
    patch:
      operationId: updateMember
      security: [{ sessionCookie: [] }]
      description: Consolidated role/status/branch assignment update. Owner may promote existing members to Owner. Manager changes subordinate roles only, cannot modify themselves/Owner/Manager and must control all old and new branches. Last active owner protection is serialized transactionally; inactive memberships lose API access immediately.
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/MemberInput' } },
            },
        }
      responses:
        '200': { $ref: '#/components/responses/Member' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }
    delete:
      operationId: removeMember
      security: [{ sessionCookie: [] }]
      description: Soft removal preserving user account, branch history and audit. No user deletion. Final active Owner cannot be removed.
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '200': { $ref: '#/components/responses/Member' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/invitations:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      operationId: listInvitations
      security: [{ sessionCookie: [] }]
      description: Owner/authorized Manager, newest 200 records, no raw tokens.
      responses:
        '200':
          {
            description: Scoped invitation list,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: array,
                                items:
                                  { $ref: '#/components/schemas/Invitation' },
                              },
                          },
                      },
                  },
              },
          }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
    post:
      operationId: inviteMember
      security: [{ sessionCookie: [] }]
      description: 48-hour hashed one-use token delivered using configured SMTP. Intended email binding; OWNER invitation prohibited. Manager cannot invite Manager or assign outside their branches. SMTP failure rolls back and returns generic 503. Delivery is bounded but not a durable outbox.
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/InviteInput' } },
            },
        }
      responses:
        '201':
          {
            description: Delivered invitation,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          { data: { $ref: '#/components/schemas/Invitation' } },
                      },
                  },
              },
          }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }
        '503': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/invitations/{invitationId}:
    parameters:
      [
        { $ref: '#/components/parameters/OrganizationID' },
        {
          in: path,
          name: invitationId,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    delete:
      operationId: revokeInvitation
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '200':
          {
            description: Revoked,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: object,
                                properties: { revoked: { type: boolean } },
                              },
                          },
                      },
                  },
              },
          }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      security: [{ sessionCookie: [] }]
      description: Authenticated intended recipient only. Rechecks inviter authority and active branch assignments. Atomically consumes invitation and creates/reactivates one membership. Expired/revoked/replayed/wrong-email tokens return 404; existing active/suspended memberships return 409.
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                additionalProperties: false,
                required: [token],
                properties: { token: { type: string, writeOnly: true } },
              }
      responses:
        '200': { $ref: '#/components/responses/OrganizationContext' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/audit:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      operationId: organizationAudit
      security: [{ sessionCookie: [] }]
      description: Newest 100 records. Owner all; Manager requires all event branches within their assignments and visible target membership. No secrets or raw tokens.
      parameters:
        [{ in: query, name: member_id, schema: { type: string, format: uuid } }]
      responses:
        '200':
          {
            description: Scoped audit events,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: array,
                                items:
                                  { $ref: '#/components/schemas/AuditEvent' },
                              },
                          },
                      },
                  },
              },
          }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations:
    get:
      operationId: listOrganizations
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Active memberships only; subordinate roles receive redacted contact fields.
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      data:
                        {
                          type: array,
                          items: { $ref: '#/components/schemas/Organization' },
                        },
                    },
                }
        '401': { $ref: '#/components/responses/AuthError' }
        '503': { $ref: '#/components/responses/AuthError' }
    post:
      operationId: createOrganization
      security: [{ sessionCookie: [] }]
      description: Atomically creates organization, OWNER membership, active main branch, default THB/Asia-Bangkok configuration and audit. Replaying the same per-user key/payload returns the same context; different payload returns 409.
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - {
            in: header,
            name: Idempotency-Key,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/OrganizationInput' }
                - {
                    type: object,
                    required: [branch],
                    properties:
                      { branch: { $ref: '#/components/schemas/BranchInput' } },
                  }
      responses:
        '201': { $ref: '#/components/responses/OrganizationContext' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }
        '503': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      operationId: getOrganization
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OrganizationContext' }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
    patch:
      operationId: updateOrganization
      security: [{ sessionCookie: [] }]
      description: OWNER only. Full editable fields; no ownership change or tenant deactivation.
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/OrganizationInput' } },
            },
        }
      responses:
        '200':
          {
            description: Updated organization,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data: { $ref: '#/components/schemas/Organization' },
                          },
                      },
                  },
              },
          }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/context:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      operationId: organizationContext
      security: [{ sessionCookie: [] }]
      description: Membership revalidated on every call. Only ACTIVE authorized branches. Owner receives all; operational roles receive organization identity with redacted contact data.
      responses:
        '200': { $ref: '#/components/responses/OrganizationContext' }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/permissions:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      operationId: effectivePermissions
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          {
            description: Stable permission identifiers,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          { data: { type: array, items: { type: string } } },
                      },
                  },
              },
          }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/roles:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      operationId: roleMatrix
      security: [{ sessionCookie: [] }]
      description: Fixed role permission map. Owner/Manager only. Manager permissions additionally require assigned branch scope and cannot modify Owner, Manager or themselves.
      responses:
        '200':
          {
            description: Fixed role map,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: object,
                                additionalProperties:
                                  { type: array, items: { type: string } },
                              },
                          },
                      },
                  },
              },
          }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/branches:
    parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
    get:
      operationId: listBranches
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          {
            description: Authorized branches; Owner also sees inactive branches,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: array,
                                items: { $ref: '#/components/schemas/Branch' },
                              },
                          },
                      },
                  },
              },
          }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
    post:
      operationId: createBranch
      security: [{ sessionCookie: [] }]
      description: OWNER only, unique code within organization.
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/BranchInput' } },
            },
        }
      responses:
        '201': { $ref: '#/components/responses/Branch' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }
  /api/v1/organizations/{id}/branches/{branchId}:
    parameters:
      [
        { $ref: '#/components/parameters/OrganizationID' },
        {
          in: path,
          name: branchId,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    get:
      operationId: getBranch
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Branch' }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
    patch:
      operationId: updateBranch
      security: [{ sessionCookie: [] }]
      description: OWNER may activate/deactivate except final ACTIVE branch. Manager updates only their ACTIVE assigned branches, without status changes. No hard-delete operation.
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/BranchInput' } },
            },
        }
      responses:
        '200': { $ref: '#/components/responses/Branch' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }
  /api/v1/auth/register:
    post:
      operationId: register
      security: []
      description: Registers an active user with pending organization onboarding; does not establish a session. Requires allowed Origin and JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password:
                  {
                    type: string,
                    minLength: 12,
                    maxLength: 128,
                    writeOnly: true,
                  }
                display_name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Registered without a session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '409': { $ref: '#/components/responses/AuthError' }
        '429': { $ref: '#/components/responses/AuthError' }
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      description: Creates a server-side session; Set-Cookie is HttpOnly, SameSite=Lax, Secure in production. Requires allowed Origin and JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, writeOnly: true }
      responses:
        '200':
          description: Session established.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '429': { $ref: '#/components/responses/AuthError' }
  /api/v1/auth/me:
    get:
      operationId: currentUser
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Active session, safe profile and CSRF token for state-changing authenticated requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ sessionCookie: [] }]
      description: Requires allowed Origin and X-CSRF-Token matching the active session.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Server session revoked and cookie cleared.
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      security: []
      description: Generic response; sends a one-time link via configured SMTP for eligible accounts. Requires allowed Origin and JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Generic reset request accepted. }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '429': { $ref: '#/components/responses/AuthError' }
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      security: []
      description: Atomically consumes a 15-minute token, changes password and revokes all sessions. Requires allowed Origin and JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, writeOnly: true }
                password:
                  {
                    type: string,
                    minLength: 12,
                    maxLength: 128,
                    writeOnly: true,
                  }
      responses:
        '200': { description: Password reset complete. }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '429': { $ref: '#/components/responses/AuthError' }
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is alive; independent of database and AI.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: PostgreSQL reachable and migration version 1 clean.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Required database or schema unavailable; no internal details disclosed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/system:
    get:
      operationId: getSystemFoundation
      security: []
      responses:
        '200':
          description: Public foundation information, not tenant/user data.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [name, phase, authentication]
                    additionalProperties: false
                    properties:
                      name: { type: string, const: SmartPOS }
                      phase: { type: integer, const: 0 }
                      authentication: { type: string, const: server_sessions }
components:
  parameters:
    OrganizationID:
      {
        in: path,
        name: id,
        required: true,
        schema: { type: string, format: uuid },
      }
    CSRF:
      {
        in: header,
        name: X-CSRF-Token,
        required: true,
        schema: { type: string },
      }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: smartpos_session
      description: Development cookie name; production uses __Host-smartpos_session.
  responses:
    OrganizationContext:
      description: Authorized organization context.
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  properties:
                    {
                      data:
                        { $ref: '#/components/schemas/OrganizationContext' },
                    },
                },
            },
        }
    Branch:
      description: Authorized branch.
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  properties: { data: { $ref: '#/components/schemas/Branch' } },
                },
            },
        }
    Member:
      description: Authorized membership.
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  properties: { data: { $ref: '#/components/schemas/Member' } },
                },
            },
        }
    InvalidInput:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthError:
      description: Authentication or rate-limit error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Role:
      {
        type: string,
        enum: [OWNER, MANAGER, CASHIER, INVENTORY_STAFF, PURCHASING_STAFF],
      }
    OrganizationInput:
      type: object
      required: [name, code, business_type]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        code:
          {
            type: string,
            maxLength: 50,
            description: Normalized to uppercase ASCII letters/digits/underscore/hyphen.,
          }
        business_type: { type: string, minLength: 1, maxLength: 80 }
        contact_email: { type: string, maxLength: 254, default: '' }
        contact_phone: { type: string, maxLength: 30, default: '' }
        address: { type: string, maxLength: 1000, default: '' }
    Organization:
      allOf:
        - { $ref: '#/components/schemas/OrganizationInput' }
        - {
            type: object,
            required: [id, currency, status],
            properties:
              {
                id: { type: string, format: uuid },
                currency: { type: string, const: THB },
                status: { type: string, enum: [ACTIVE, INACTIVE] },
              },
          }
    BranchInput:
      type: object
      additionalProperties: false
      required: [name, code]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        code: { type: string, maxLength: 50 }
        address: { type: string, maxLength: 1000, default: '' }
        phone: { type: string, maxLength: 30, default: '' }
        email: { type: string, maxLength: 254, default: '' }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
    Branch:
      type: object
      required:
        [
          id,
          organization_id,
          name,
          code,
          address,
          phone,
          email,
          status,
          is_main,
        ]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        address: { type: string }
        phone: { type: string }
        email: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        is_main: { type: boolean }
    MemberInput:
      type: object
      additionalProperties: false
      required: [role, status, branch_ids]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [ACTIVE, SUSPENDED, REMOVED] }
        branch_ids:
          {
            type: array,
            maxItems: 100,
            uniqueItems: true,
            items: { type: string, format: uuid },
            description: Nonempty ACTIVE same-tenant branches for non-Owner memberships; empty for OWNER.,
          }
    Member:
      type: object
      additionalProperties: false
      required:
        [
          id,
          user_id,
          email,
          display_name,
          role,
          status,
          branch_ids,
          permissions,
        ]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [ACTIVE, SUSPENDED, REMOVED] }
        branch_ids:
          {
            type: array,
            uniqueItems: true,
            items: { type: string, format: uuid },
          }
        permissions: { type: array, items: { type: string } }
    OrganizationContext:
      type: object
      required: [organization, membership, branches, permissions]
      properties:
        organization: { $ref: '#/components/schemas/Organization' }
        membership: { $ref: '#/components/schemas/Member' }
        branches:
          { type: array, items: { $ref: '#/components/schemas/Branch' } }
        permissions: { type: array, items: { type: string } }
    InviteInput:
      type: object
      additionalProperties: false
      required: [email, role, branch_ids]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role:
          {
            type: string,
            enum: [MANAGER, CASHIER, INVENTORY_STAFF, PURCHASING_STAFF],
          }
        branch_ids:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            uniqueItems: true,
            items: { type: string, format: uuid },
          }
    Invitation:
      allOf:
        - { $ref: '#/components/schemas/InviteInput' }
        - {
            type: object,
            required: [id, expires_at, status],
            properties:
              {
                id: { type: string, format: uuid },
                expires_at: { type: string, format: date-time },
                status:
                  { type: string, enum: [PENDING, ACCEPTED, REVOKED, EXPIRED] },
              },
          }
    AuditEvent:
      type: object
      required: [id, actor_id, event_type, object_id, request_id, created_at]
      properties:
        id: { type: integer }
        actor_id: { type: string, format: uuid }
        event_type: { type: string }
        object_id: { type: string, format: uuid }
        request_id: { type: string }
        created_at: { type: string, format: date-time }
    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, status, onboarding]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        onboarding: { type: string, const: PENDING_ORGANIZATION }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    SessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, csrf_token]
          properties:
            user: { $ref: '#/components/schemas/User' }
            csrf_token:
              {
                type: string,
                description: Short-lived browser-memory-only CSRF proof; never persist in browser storage.,
              }
    Liveness:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, const: ok }
    Readiness:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, const: ready }
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string, pattern: '^[a-f0-9]{32}$' }
  headers:
    RequestID:
      description: Generated opaque request correlation ID.
      schema: { type: string, pattern: '^[a-f0-9]{32}$' }
