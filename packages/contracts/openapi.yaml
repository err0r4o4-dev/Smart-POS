    sessionCookie:
      type: apiKey
      in: cookie
      name: smartpos_session
      description: Development cookie name; production uses __Host-smartpos_session.
  responses:
    OrganizationContext:
      description: Authorized organization context.
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  properties:
                    {
                      data:
                        { $ref: '#/components/schemas/OrganizationContext' },
                    },
                },
            },
        }
    Branch:
      description: Authorized branch.
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  properties: { data: { $ref: '#/components/schemas/Branch' } },
                },
            },
        }
    Member:
      description: Authorized membership.
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
